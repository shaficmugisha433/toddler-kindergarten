<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Toddler Town Kindergarten</title>
  <style>
    :root { --primary:#ff6b6b; --secondary:#4ecdc4; --dark:#17324d; --text:#243447; --muted:#5c6780; --light:#f7f9fc; --line:#e7edf5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, Helvetica, sans-serif; color: var(--text); background:#fff; line-height:1.6; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1100px, 92vw); margin: 0 auto; }
    .topbar { background: var(--dark); color:#fff; padding:10px 0; }
    .topbar-inner { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .nav { background: rgba(255,255,255,.96); position: sticky; top:0; border-bottom:1px solid var(--line); }
    .nav-inner { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px 0; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; color:var(--dark); }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; }
    .nav-links { display:flex; gap:18px; flex-wrap: wrap; }
    .nav-links a { color: var(--dark); font-weight: 600; }
    .btn { display:inline-block; padding:12px 16px; border-radius:999px; font-weight:700; }
    .btn-primary { background: var(--primary); color:#fff; }
    .page-header { background: linear-gradient(135deg, rgba(255,107,107,.08), rgba(78,205,196,.10)); padding: 62px 0; }
    .page-header h1 { margin:0; color: var(--dark); font-size: clamp(2.2rem, 4vw, 3.3rem); }
    .content { display:grid; grid-template-columns: 1fr 1fr; gap:28px; padding: 60px 0; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 12px 28px rgba(0,0,0,.03); }
    input, textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font: inherit; }
    textarea { min-height:130px; resize: vertical; }
    .info { display:grid; gap:16px; color: var(--muted); }
    @media (max-width: 840px) { .content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div>📍 Kampala Along Hoima Road</div>
      <div>📞 +256 742 384 700</div>
    </div>
  </div>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">🏫</span>
        <span>Toddler Town <small>Kindergarten</small></span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="curriculum.html">Curriculum</a>
        <a href="admission.html">Admissions</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html" class="btn btn-primary">Admin</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <div class="container"><h1>Contact</h1></div>
  </header>

  <main class="container content">
    <div class="card info">
      <p><strong>Phone:</strong> +256 742 384 700</p>
      <p><strong>Email:</strong> info@toddertown.edu</p>
      <p><strong>Location:</strong> Kampala Along Hoima Road</p>
      <p><strong>Office Hours:</strong> Monday to Friday, 7:30 AM – 6:00 PM</p>
    </div>
    <div class="card">
      <h2 style="margin-top:0; color:var(--dark);">Send a message</h2>
      <form>
        <input type="text" placeholder="Full name" aria-label="Full name">
        <input type="email" placeholder="Email address" aria-label="Email address">
        <input type="tel" placeholder="Phone number" aria-label="Phone number">
        <textarea placeholder="How can we help?"></textarea>
        <button class="btn btn-primary" type="button">Send message</button>
      </form>
    </div>
  </main>
</body>
</html>
