<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f9ff;
      color: #1d2a36;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 640px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      border: 1px solid #e7edf3;
      box-shadow: 0 18px 45px rgba(0,0,0,0.05);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.7; color: #53677a; }
    a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #4ecdc4;
      color: #0f2d2b;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin dashboard</h1>
    <p>
      The full dashboard is part of the PHP application and cannot run directly on GitHub Pages.
      Run the project locally with PHP to access the admin experience.
    </p>
    <a href="./index.html">Back to project overview</a>
  </div>
</body>
</html>
